services:
  # Reverse Proxy (Public Entry Point)
  reverse-proxy:
    image: nginx:alpine-slim
    container_name: chargeback-shield-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - chargeback-shield-network

  # React / Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chargeback-shield-frontend
    restart: always
    expose:
      - "80"
    environment:
      - VITE_API_BASE_URL=http://localhost/api
      - VITE_APP_ENV=production
    networks:
      - chargeback-shield-network

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chargeback-shield-backend
    restart: always
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:////app/data/chargeback_shield.db
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - ENABLE_DOCS=false
      - ENABLE_OPENAPI=false
    volumes:
      - evidence-data:/app/storage/evidence
      - processed-data:/app/storage/processed
      - db-data:/app/data
    networks:
      - chargeback-shield-network

networks:
  chargeback-shield-network:
    driver: bridge
    name: chargeback-shield-network

volumes:
  evidence-data:
    name: chargeback-shield-evidence
  processed-data:
    name: chargeback-shield-processed
  db-data:
    name: chargeback-shield-db
